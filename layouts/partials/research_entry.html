<article class="post-entry research-entry">
  <header class="entry-header">
    <h3>{{ .Title }}</h3>
  </header>
  <div class="entry-content">
    <p>{{ .Summary | plainify | htmlUnescape }}</p>
  </div>
  <a class="entry-link" aria-label="Read about {{ .Title | plainify }}" href="{{ .RelPermalink }}"></a>
</article>
